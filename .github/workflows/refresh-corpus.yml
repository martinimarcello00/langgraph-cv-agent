name: Refresh corpus from the website

on:
  # The website can trigger this on deploy; needs a PAT with contents:write on
  # this repo, stored there as a secret.
  repository_dispatch:
    types: [content-updated]
  # Safety net, so content is never more than a day stale even without the hook.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-corpus
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Fetch the published corpus
        env:
          # Set when the website dispatches after a deploy. Empty for the daily
          # run, which takes whatever is being served.
          EXPECTED: ${{ github.event.client_payload.contentHash }}
        run: |
          # A deploy reports success before the CDN stops serving the previous
          # build. Fetching immediately would compare the old corpus with the
          # old corpus, find no change, and end the run reporting success.
          for attempt in $(seq 1 20); do
            curl -sSf --retry 3 --retry-delay 5 --max-time 60 \
              https://marcellomartini.tech/agent-corpus.json -o /tmp/corpus.json
            SERVED=$(python -c "import json;print(json.load(open('/tmp/corpus.json'))['meta']['contentHash'])")
            if [ -z "$EXPECTED" ] || [ "$SERVED" = "$EXPECTED" ]; then
              echo "fetched $(wc -c < /tmp/corpus.json) bytes, hash $SERVED"
              exit 0
            fi
            echo "attempt $attempt: edge still serving $SERVED, waiting for $EXPECTED"
            sleep 15
          done
          echo "::error::the site never served $EXPECTED; the daily run will retry"
          exit 1

      - name: Stop early if the content has not changed
        id: diff
        run: |
          OLD=$(python -c "import json;print(json.load(open('corpus/corpus.json'))['meta']['contentHash'])")
          NEW=$(python -c "import json;print(json.load(open('/tmp/corpus.json'))['meta']['contentHash'])")
          echo "old=$OLD"
          echo "new=$NEW"
          echo "hash=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$OLD" = "$NEW" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.diff.outputs.changed == 'true'
        run: pip install -r requirements.txt

      # The gate: a malformed corpus fails here rather than becoming an image
      # full of empty documents.
      - name: Validate, index and smoke test
        if: steps.diff.outputs.changed == 'true'
        run: |
          cp /tmp/corpus.json corpus/corpus.json
          python build_index.py
          python verify_corpus.py
        env:
          OPENAI_API_KEY: sk-not-used-by-these-checks

      # Hugging Face paused the Space once over home lab prose in the corpus.
      # Their review cleared that content, so this does not gate the refresh. It
      # records anything new on the subject and opens an issue, so a repeat
      # arrives as a notification rather than as a dead Space.
      - name: Check new content against the reviewed vocabulary
        id: policy
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          python check_corpus_policy.py | tee /tmp/policy-report.txt

      - name: Record the new vocabulary
        if: steps.diff.outputs.changed == 'true' && steps.policy.outcome == 'failure'
        run: python check_corpus_policy.py --update

      - name: Commit the new corpus
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Restricted to corpus/ on purpose: this job syncs content, never code.
          git add corpus/corpus.json corpus/catalog.txt corpus/reviewed-vocabulary.json
          git commit -m "chore: refresh corpus from the website

          contentHash ${{ steps.diff.outputs.hash }}"
          git push

      - name: Open an issue for the new content
        if: steps.diff.outputs.changed == 'true' && steps.policy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The corpus refresh published content using tunnelling or proxy vocabulary for the first time. It is live on the Space and has been recorded in corpus/reviewed-vocabulary.json."
            echo
            echo "Hugging Face cleared this class of content in September: writing about such tools is permitted, using them is not. Confirm the document below is ordinary editorial writing."
            echo
            cat /tmp/policy-report.txt
          } > /tmp/issue.md
          gh issue create --title "Corpus: new content uses tunnelling vocabulary" --body-file /tmp/issue.md
